<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Mobile · 手机连接</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#202124;font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:720px;margin:72px auto;padding:0 28px}.eyebrow{font-size:12px;letter-spacing:.1em;color:#71717a}h1{font-size:34px;letter-spacing:-.04em;line-height:1.25;margin:12px 0}p{color:#666}section{background:#fff;border:1px solid #e5e5e5;border-radius:20px;padding:28px;margin:28px 0;display:flex;align-items:center;gap:32px}img{width:240px;height:240px;flex:none}.status{display:inline-block;padding:4px 10px;background:#f1f5f1;color:#386347;border-radius:8px;font-size:12px}small{display:block;color:#777;line-height:1.7}.detail{margin-top:28px;border-top:1px solid #e5e5e5;padding-top:20px}#demo{color:#9a6700;font-size:12px}img[hidden]{display:none}@media(max-width:600px){main{margin:36px auto}h1{font-size:28px}section{flex-direction:column;gap:16px;text-align:center}}</style></head>
<body><main><div class="eyebrow">CODEX MOBILE</div><h1>手机扫码，继续电脑上的 Codex</h1><p>在微信中扫一扫，打开手机网页。服务与会话仍由你的电脑处理。</p><div id="demo" hidden>演示模式 · 二维码无效，不连接任何真实账户</div><section><img id="qr" hidden alt="手机配对二维码"><div><span class="status" id="status">正在检查连接</span><p id="note">正在验证 HTTPS 和双向连接。</p><small>二维码包含配对凭据，请私下使用。<br>电脑需保持开机、联网。</small></div></section><div class="detail"><strong>连接方式</strong><p>手机 → HTTPS 公网入口 → 隧道 → 本机 Codex 服务</p><small>这是微信扫码打开的网页，不是微信聊天机器人，也不是 Codex 官方远程控制功能。</small></div></main><script>
async function refresh(){try{const r=await fetch('/api/mobile',{cache:'no-store'}),s=await r.json(),online=r.ok&&s.status==='online'&&s.qr;document.querySelector('#status').textContent=online?(s.probe?'网络测试可用':'手机扫码可访问'):'连接恢复中';document.querySelector('#note').textContent=online?(s.probe?'当前仅测试网络，不包含 Codex 数据。':'用微信扫一扫，进入项目与会话。'):'等待公网连接恢复，二维码将在验证成功后显示。';const qr=document.querySelector('#qr');qr.hidden=!online;if(online)qr.src=s.qr;else qr.removeAttribute('src');document.querySelector('#demo').hidden=!s.demo}catch{document.querySelector('#status').textContent='本机服务暂不可用';document.querySelector('#qr').hidden=true}}
refresh();setInterval(()=>{if(!document.hidden)refresh()},5000);
</script></body></html>
